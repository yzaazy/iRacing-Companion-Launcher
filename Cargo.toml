[package]
name = "iracing-companion-launcher"
version = "3.0.1"
edition = "2024"
rust-version = "1.95"
description = "Launches and manages iRacing companion applications"
license = "MIT"
repository = "https://github.com/yzaazy/iRacing-Companion-Launcher"
publish = false

# String fields of the exe's version resource, embedded by build.rs. FileVersion and
# ProductVersion come from `version` above.
[package.metadata.winresource]
CompanyName = "Tobias Termeczky"
FileDescription = "iRacing Companion Launcher"
InternalName = "iRacing Companion Launcher"
LegalCopyright = "© 2026 Tobias Termeczky"
OriginalFilename = "iRacing Companion Launcher.exe"
ProductName = "iRacing Companion Launcher"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "wgpu",
] }
egui = "0.37.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
borrow_as_ptr = "warn"
derive_partial_eq_without_eq = "warn"
trivially_copy_pass_by_ref = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
proptest = "1.12.0"
tempfile = "3.27.0"

# Dependencies (egui, wgpu, the image codecs) optimised in debug builds: the UI tests render
# and lay out whole windows, and spend most of their time inside them.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
# Unwind, so the worker thread can catch a panic in a sequence (src/worker.rs, issue #5).
panic = "unwind"
strip = true
